services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  db:
    image: postgres:18
    # No published port: the backend reaches the DB over the compose
    # network. Unlike the dev stack, nothing on the LAN needs psql access.
    environment:
      POSTGRES_DB: plantmonitor
      POSTGRES_USER: plantmonitor
      # From .env (gitignored) — see .env.example. Only set on first init
      # of the volume; change it later via ALTER USER, not here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      # PG 18+ convention: mount the parent dir; data lives in a versioned
      # subdir so a future pg_upgrade --link works in-place.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantmonitor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Prebuilt image from GHCR (private — needs `docker login ghcr.io`, see
  # README). Bundles the REST API, the Angular PWA and the MQTT->Postgres
  # ingest worker.
  backend:
    image: ghcr.io/owellnitz/plant-monitor/backend:latest
    # No published port: Caddy terminates TLS and reaches the backend over
    # the compose network. Exposing 8080 on the LAN again would give clients
    # a plain-http origin, where the PWA loses its service worker and push.
    environment:
      Mqtt__Host: mqtt
      ConnectionStrings__Db: Host=db;Username=plantmonitor;Password=${POSTGRES_PASSWORD:?set in .env};Database=plantmonitor
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped
    labels:
      # Only this container is auto-updated by Watchtower; db/mqtt are not.
      - "com.centurylinklabs.watchtower.enable=true"

  # HTTPS entrypoint. Built locally because the deSEC DNS module is not in
  # the upstream image — see caddy/Dockerfile. Certificates and the ACME
  # account key live in caddy-data, so renewals survive a recreate.
  caddy:
    build: ./caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # e.g. plants.dedyn.io — its A record points at this machine's LAN IP.
      PLANT_HOST: ${PLANT_HOST:?set in .env}
      # deSEC API token, scoped to that domain. From .env (gitignored).
      DESEC_TOKEN: ${DESEC_TOKEN:?set in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

  # Polls GHCR every 5 min and recreates the backend container when a new
  # :latest is pushed by CI. --label-enable scopes it to the labeled
  # service only; --cleanup removes the superseded image afterwards.
  watchtower:
    image: containrrr/watchtower
    environment:
      # containrrr/watchtower is stale; its built-in Docker client negotiates
      # API 1.25, which newer daemons reject (min 1.40). Pin the version it
      # sends so it can talk to the host daemon.
      DOCKER_API_VERSION: "1.40"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Private GHCR image: Watchtower reads the host's root docker login to
      # pull :latest. Run `sudo docker login ghcr.io` BEFORE the first
      # `compose up`, else this bind mount creates a directory and auth fails.
      - /root/.docker/config.json:/config.json:ro
    command: --interval 300 --label-enable --cleanup
    restart: unless-stopped

volumes:
  postgres-data:
  mosquitto-data:
  caddy-data:
  caddy-config:
